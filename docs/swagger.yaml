definitions:
  api.DebtResponse:
    properties:
      amount:
        type: number
      currency:
        type: string
      id:
        type: integer
      owedByUser:
        $ref: '#/definitions/api.UserSummary'
      owedToUser:
        $ref: '#/definitions/api.UserSummary'
    type: object
  api.Exchange:
    properties:
      date:
        type: string
      fromCurrency:
        type: string
      rate:
        type: number
      toCurrency:
        type: string
    type: object
  api.ExchangeSummary:
    properties:
      date:
        type: string
      fromCurrency:
        type: string
      id:
        type: integer
      rate:
        type: number
      toCurrency:
        type: string
    type: object
  api.Payment:
    properties:
      amount:
        type: number
      date:
        type: string
      debtMode:
        type: string
      debtors:
        items:
          type: string
        type: array
      description:
        type: string
      fromExchangeRate:
        type: string
      payer:
        type: string
      toExchangeRate:
        type: string
    type: object
  api.PaymentResponse:
    properties:
      amount:
        type: number
      date:
        type: string
      debtors:
        items:
          $ref: '#/definitions/api.UserSummary'
        type: array
      description:
        type: string
      exchange:
        $ref: '#/definitions/api.ExchangeSummary'
      id:
        type: integer
      payer:
        $ref: '#/definitions/api.UserSummary'
    type: object
  api.User:
    properties:
      name:
        type: string
    type: object
  api.UserSummary:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
info:
  contact: {}
paths:
  /api/v1/admin/backup:
    post:
      description: Starts a Postgres backup job (pg_dump)
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Trigger a database backup
      tags:
      - admin
  /api/v1/admin/backup/{filename}:
    get:
      description: Downloads a Postgres backup file
      parameters:
      - description: Backup filename
        in: path
        name: filename
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Download a database backup
      tags:
      - admin
  /api/v1/admin/exchange-rate:
    get:
      description: Returns the exchange rate for `from` -> `to` on a given date (defaults
        to today if date is omitted).
      parameters:
      - description: Base currency code (e.g. USD)
        in: query
        name: from
        required: true
        type: string
      - description: Target currency code (e.g. EUR)
        in: query
        name: to
        required: true
        type: string
      - description: Date in YYYY-MM-DD format
        in: query
        name: date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Exchange'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get exchange rate between two currencies
      tags:
      - admin
  /api/v1/admin/exchange-rates:
    get:
      description: Returns the exchange rates stored in the DB
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.Exchange'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get all exchange rates stored in the DB
      tags:
      - admin
  /api/v1/debts:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.DebtResponse'
            type: array
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Fetch all debts as From-To user debt pairs
      tags:
      - debts
  /api/v1/debts/users:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              items:
                $ref: '#/definitions/api.DebtResponse'
              type: array
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Fetch a map of users to their debts
      tags:
      - debts
  /api/v1/health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - health
  /api/v1/payment:
    post:
      consumes:
      - application/json
      parameters:
      - description: Payment payload
        in: body
        name: payment
        required: true
        schema:
          $ref: '#/definitions/api.Payment'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a new payment
      tags:
      - payment
  /api/v1/payment/{id}:
    delete:
      parameters:
      - description: Payment ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete a payment by ID
      tags:
      - payment
    get:
      parameters:
      - description: Payment ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.PaymentResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get a payment by ID
      tags:
      - payment
  /api/v1/payment/all:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.PaymentResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get all payments
      tags:
      - payment
  /api/v1/user:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.UserSummary'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get all users
      tags:
      - user
    post:
      consumes:
      - application/json
      parameters:
      - description: User payload
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/api.User'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a new user
      tags:
      - user
  /api/v1/user/{id}:
    delete:
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete a user by ID
      tags:
      - user
swagger: "2.0"

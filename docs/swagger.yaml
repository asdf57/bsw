definitions:
  api.Checkpoint:
    properties:
      debts:
        items:
          $ref: '#/definitions/api.CheckpointDebt'
        type: array
      exchangeRates:
        items:
          $ref: '#/definitions/api.Exchange'
        type: array
      exportedAt:
        type: string
      payments:
        items:
          $ref: '#/definitions/api.CheckpointPayment'
        type: array
      settlements:
        items:
          $ref: '#/definitions/api.CheckpointSettlement'
        type: array
      tags:
        items:
          $ref: '#/definitions/api.CheckpointTag'
        type: array
      users:
        items:
          $ref: '#/definitions/api.CheckpointUser'
        type: array
      version:
        type: integer
    type: object
  api.CheckpointDebt:
    properties:
      amount:
        type: number
      createdAt:
        type: string
      currency:
        type: string
      id:
        type: integer
      owedBy:
        type: string
      owedTo:
        type: string
      updatedAt:
        type: string
    type: object
  api.CheckpointImportResponse:
    properties:
      debts:
        type: integer
      exchangeRates:
        type: integer
      payments:
        type: integer
      settlements:
        type: integer
      tags:
        type: integer
      users:
        type: integer
    type: object
  api.CheckpointPayment:
    properties:
      amount:
        type: number
      currency:
        type: string
      date:
        type: string
      debtors:
        items:
          type: string
        type: array
      description:
        type: string
      id:
        type: integer
      payer:
        type: string
      tags:
        items:
          type: string
        type: array
    type: object
  api.CheckpointSettlement:
    properties:
      amount:
        type: number
      currency:
        type: string
      date:
        type: string
      id:
        type: integer
      owedBy:
        type: string
      owedTo:
        type: string
      reversedAt:
        type: string
    type: object
  api.CheckpointTag:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  api.CheckpointUser:
    properties:
      discordHandle:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  api.DebtResponse:
    properties:
      amount:
        type: number
      currency:
        type: string
      id:
        type: integer
      owedByUser:
        $ref: '#/definitions/api.UserSummary'
      owedToUser:
        $ref: '#/definitions/api.UserSummary'
    type: object
  api.Exchange:
    properties:
      date:
        type: string
      fromCurrency:
        type: string
      rate:
        type: number
      toCurrency:
        type: string
    type: object
  api.Payment:
    properties:
      amount:
        type: number
      currency:
        type: string
      date:
        type: string
      debtMode:
        type: string
      debtors:
        items:
          type: string
        type: array
      description:
        type: string
      payer:
        type: string
      tags:
        items:
          type: string
        type: array
    type: object
  api.PaymentResponse:
    properties:
      amount:
        type: number
      currency:
        type: string
      date:
        type: string
      debtors:
        items:
          $ref: '#/definitions/api.UserSummary'
        type: array
      description:
        type: string
      id:
        type: integer
      payer:
        $ref: '#/definitions/api.UserSummary'
      tags:
        items:
          type: string
        type: array
    type: object
  api.SettleDebtsRequest:
    properties:
      owedBy:
        type: string
      owedTo:
        type: string
    required:
    - owedBy
    type: object
  api.SettleDebtsResponse:
    properties:
      owedBy:
        type: string
      owedTo:
        type: string
      settledCount:
        type: integer
      settlements:
        items:
          $ref: '#/definitions/api.SettlementResponse'
        type: array
    type: object
  api.SettlementResponse:
    properties:
      amount:
        type: number
      currency:
        type: string
      date:
        type: string
      id:
        type: integer
      owedByUser:
        $ref: '#/definitions/api.UserSummary'
      owedToUser:
        $ref: '#/definitions/api.UserSummary'
      reversedAt:
        type: string
    type: object
  api.Tag:
    properties:
      tag:
        type: string
    type: object
  api.TagResponse:
    properties:
      id:
        type: integer
      tag:
        type: string
    type: object
  api.User:
    properties:
      discordHandle:
        type: string
      name:
        type: string
    type: object
  api.UserStatsResponse:
    properties:
      currency:
        type: string
      paymentsIncluded:
        type: integer
      spentOut:
        type: number
      totalSpent:
        type: number
      user:
        $ref: '#/definitions/api.UserSummary'
    type: object
  api.UserSummary:
    properties:
      discordHandle:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
info:
  contact: {}
paths:
  /api/v1/admin/backup:
    post:
      description: Starts a Postgres backup job (pg_dump)
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Trigger a database backup
      tags:
      - admin
  /api/v1/admin/backup/{filename}:
    get:
      description: Downloads a Postgres backup file
      parameters:
      - description: Backup filename
        in: path
        name: filename
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Download a database backup
      tags:
      - admin
  /api/v1/admin/exchange-rate:
    get:
      description: Returns the exchange rate for `from` -> `to` on a given date (defaults
        to today if date is omitted).
      parameters:
      - description: Base currency code (e.g. USD)
        in: query
        name: from
        required: true
        type: string
      - description: Target currency code (e.g. EUR)
        in: query
        name: to
        required: true
        type: string
      - description: Date in YYYY-MM-DD format
        in: query
        name: date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Exchange'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get exchange rate between two currencies
      tags:
      - admin
  /api/v1/admin/exchange-rates:
    get:
      description: Returns the exchange rates stored in the DB
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.Exchange'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get all exchange rates stored in the DB
      tags:
      - admin
  /api/v1/admin/export:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Checkpoint'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Export a portable system checkpoint
      tags:
      - admin
  /api/v1/admin/import:
    post:
      consumes:
      - application/json
      parameters:
      - description: Checkpoint payload
        in: body
        name: checkpoint
        required: true
        schema:
          $ref: '#/definitions/api.Checkpoint'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.CheckpointImportResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Import a portable system checkpoint and replace current app state
      tags:
      - admin
  /api/v1/debts:
    get:
      parameters:
      - default: USD
        description: Currency for generated debts
        in: query
        name: currency
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.DebtResponse'
            type: array
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Fetch all debts as From-To user debt pairs
      tags:
      - debts
  /api/v1/debts/settle:
    post:
      consumes:
      - application/json
      parameters:
      - description: Settle debts payload
        in: body
        name: settle
        required: true
        schema:
          $ref: '#/definitions/api.SettleDebtsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SettleDebtsResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Settle debts for a user
      tags:
      - debts
  /api/v1/debts/settlements:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.SettlementResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Fetch settlement history
      tags:
      - debts
  /api/v1/debts/settlements/{id}/reverse:
    post:
      parameters:
      - description: Settlement ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SettlementResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Reverse a settlement by ID
      tags:
      - debts
  /api/v1/debts/users:
    get:
      parameters:
      - default: USD
        description: Currency for generated debts
        in: query
        name: currency
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              items:
                $ref: '#/definitions/api.DebtResponse'
              type: array
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Fetch a map of users to their debts
      tags:
      - debts
  /api/v1/health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - health
  /api/v1/payment:
    post:
      consumes:
      - application/json
      parameters:
      - description: Payment payload
        in: body
        name: payment
        required: true
        schema:
          $ref: '#/definitions/api.Payment'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a new payment
      tags:
      - payment
  /api/v1/payment/{id}:
    delete:
      parameters:
      - description: Payment ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete a payment by ID
      tags:
      - payment
    get:
      parameters:
      - description: Payment ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.PaymentResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get a payment by ID
      tags:
      - payment
    put:
      consumes:
      - application/json
      parameters:
      - description: Payment ID
        in: path
        name: id
        required: true
        type: integer
      - description: Payment payload
        in: body
        name: payment
        required: true
        schema:
          $ref: '#/definitions/api.Payment'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.PaymentResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update a payment by ID
      tags:
      - payment
  /api/v1/payment/all:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.PaymentResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get all payments
      tags:
      - payment
  /api/v1/payment/tag/{tag}:
    get:
      parameters:
      - description: Payment tag
        in: path
        name: tag
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.PaymentResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get payments by tag
      tags:
      - payment
  /api/v1/payment/tags:
    get:
      parameters:
      - collectionFormat: multi
        description: Payment tags
        in: query
        items:
          type: string
        name: tags
        required: true
        type: array
      - default: and
        description: 'Tag operation: and/or'
        enum:
        - and
        - or
        in: query
        name: op
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.PaymentResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get payments by tags
      tags:
      - payment
  /api/v1/stats/user:
    get:
      parameters:
      - description: User name
        in: query
        name: user
        required: true
        type: string
      - default: USD
        description: Currency for generated stats
        in: query
        name: currency
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.UserStatsResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get user spending statistics
      tags:
      - stats
  /api/v1/tags:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.TagResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get all payment tags
      tags:
      - tag
    post:
      consumes:
      - application/json
      parameters:
      - description: Tag payload
        in: body
        name: tag
        required: true
        schema:
          $ref: '#/definitions/api.Tag'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.TagResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a payment tag
      tags:
      - tag
  /api/v1/user:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.UserSummary'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get all users
      tags:
      - user
    post:
      consumes:
      - application/json
      parameters:
      - description: User payload
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/api.User'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a new user
      tags:
      - user
  /api/v1/user/{id}:
    delete:
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete a user by ID
      tags:
      - user
swagger: "2.0"
